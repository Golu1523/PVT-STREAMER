<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STREAMER PANEL</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login-page" class="page">
  <div class="login-box">
    <div class="logo">STREAMER PANEL</div>
    <div class="subtitle">ENTER KEY TO CONTROL</div>
    <input type="text" id="key-input" placeholder="Enter your key..." maxlength="100" spellcheck="false">
    <button id="connect-btn" onclick="connect()">CONNECT</button>
    <div id="login-error" class="error-msg"></div>
  </div>
</div>
<div id="panel-page" class="page hidden">
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">STREAMER PANEL</span>
      <span class="key-display" id="key-display"></span>
    </div>
    <div class="status-row">
      <div class="status-box" id="online-status">
        <span class="status-label">STATUS</span>
        <span class="status-value offline">OFFLINE</span>
      </div>
      <div class="status-box" id="aimbot-status">
        <span class="status-label">AIMBOT</span>
        <span class="status-value off">OFF</span>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-scan" id="btn-scan" onclick="sendCmd('scan')">SCAN</button>
      <div class="btn-row">
        <button class="btn btn-aimbot-on" id="btn-aimbot-on" onclick="sendAimbot(true)">ON</button>
        <button class="btn btn-aimbot-off" id="btn-aimbot-off" onclick="sendAimbot(false)">OFF</button>
      </div>
      <button class="btn btn-close" id="btn-close" onclick="sendCmd('close')">CLOSE</button>
    </div>
    <div class="log-box" id="log-box">
      <div class="log-entry">[PANEL] Waiting for connection...</div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
